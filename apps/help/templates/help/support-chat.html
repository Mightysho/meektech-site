{% extends "base.html" %}

{% block content %}

<h2>
    Chat #{{ session.id }}
</h2>

{% for msg in messages %}

<div>

    <b>{{ msg.sender }}</b>

    <p>
        {{ msg.message }}
    </p>

</div>

{% endfor %}
<form id="reply-form">

    <input id="reply-message" placeholder="Reply...">

    <button type="submit">
        Send
    </button>

</form>

<script>

    document
        .getElementById("reply-form")
        .addEventListener(
            "submit",
            function (e) {

                e.preventDefault()

                let msg =
                    document.getElementById(
                        "reply-message"
                    ).value

                fetch(
                    "/admin-send-message/{{session.id}}/",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },
                        body:
                            "message=" + msg
                    }
                )
            }
        )

</script>
{% endblock %}
