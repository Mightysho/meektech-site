{% extends "base.html" %}
{% load static %}

{% block title %}Live Support Chat{% endblock %}

{% block extra_head %}
<style>

</style>
{% endblock %}

{% block content %}

<div class="faq-wrapper">

    <!-- HEADER -->
    <div class="bg-gradient-to-t from-primary-500/10 to-transparent py-12 px-5">
        <div class="text-center max-w-2xl mx-auto">

            <h1 class="text-3xl md:text-4xl font-semibold text-black mb-3 leading-tight">
                Welcome to our Live Support Chat
            </h1>

            <p class="text-[#121212] text-medium md:text-base">
                Need to talk to us? Send us a message, and we'll get back to you as soon as possible.
            </p>
        </div>
    </div>
</div>

<div id="chat-box"></div>

<input id="message" placeholder="Type your message..." />
<button onclick="sendMessage()">Send</button>

<button id="human-support">
    Talk To Human
</button>

<script>
    function sendMessage() {
        let msg = document.getElementById("message").value;

        fetch("/send-message/", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
            },
            body: "message=" + msg
        })
            .then(res => res.json())
            .then(data => {
                document.getElementById("chat-box").innerHTML +=
                    "<div>User: " + msg + "</div>";

                document.getElementById("chat-box").innerHTML +=
                    "<div>AI: " + data.reply + "</div>";
            });
    }
</script>

{% endblock %}
